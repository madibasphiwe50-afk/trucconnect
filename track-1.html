<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Follow trip · TruckConnect</title>
<style>
:root{--bg:#ffffff;--fg:#111;--sub:#6b7280;--card:#ffffff;--line:#e5e7eb;--green:#0b6a3b;--blue:#1677F2;}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d10;--fg:#fff;--sub:#9aa3af;--card:#13161b;--line:#2b3038;}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Roboto,system-ui,-apple-system,Segoe UI,sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#head{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:10px}
#head b{font-size:16px}#head span{font-size:12px;color:var(--sub);margin-left:auto}
#map{flex:1;min-height:0;background:#e5e7eb}
#card{padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
#st{font-size:18px;font-weight:700;margin-bottom:2px}
#sub{font-size:13px;color:var(--sub);margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.row small{color:var(--sub);display:block;font-size:12px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--green);color:#fff;font-size:12px;font-weight:700}
.pill.off{background:#6b7280}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:16px;background:var(--bg);z-index:5}
.trk{width:46px;height:46px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.trk svg{width:100%;height:100%;display:block;overflow:visible}
.trk i{display:block;width:100%;height:100%;transition:transform .6s;transform-origin:50% 50%}
.trk img{width:100%;height:100%;display:block;object-fit:contain}
.dot{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="app">
  <div id="head"><b>TruckConnect</b><span id="upd"></span></div>
  <div style="position:relative;flex:1;min-height:0;display:flex">
    <div id="map" style="flex:1"></div>
    <div id="msg">Loading trip…</div>
  </div>
  <div id="card">
    <div id="st">Loading…</div>
    <div id="sub"></div>
    <div class="row" id="r-driver" style="display:none"><div><b id="drv"></b><small id="trk"></small></div><span class="pill" id="pill" style="margin-left:auto"></span></div>
  </div>
</div>

const $=id=>document.getElementById(id);
const token=new URLSearchParams(location.search).get('t')||'';
function showMsg(t){const m=$('msg');m.textContent=t;m.style.display='flex';}
if(!/^[0-9a-f]{20,}$/i.test(token)){showMsg('This trip link is not valid.');}
else{
  const app=initializeApp({apiKey:"AIzaSyD0dRuRqbsJr0-Kv29xcpQGjW-1DiYPNLo",authDomain:"truck-connect-c0c67.firebaseapp.com",projectId:"truck-connect-c0c67",appId:"1:313065662016:web:a43aecfce5d7db205d61a5"});
  const db=getFirestore(app);
  let data=null,map=null,drv=null,drvEl=null,pinA=null,fitted=false,libs=null,rtLine=null,rtLine2=null,rtKey='',rtAt=0,rtBusy=false;
  function load(cb){
    if(window.google&&google.maps&&google.maps.importLibrary){return cb();}
    window._tcMapReady=cb;
    const s=document.createElement('script');
    s.src='https://maps.googleapis.com/maps/api/js?key='+GMAPS_KEY+'&v=weekly&loading=async&callback=_tcMapReady';
    s.onerror=()=>showMsg('The map could not load. Check your internet and try again.');
    document.head.appendChild(s);
  }
  async function ensureMap(){
    if(map)return;
    const {Map}=await google.maps.importLibrary('maps');
    libs=await google.maps.importLibrary('marker');
    const c=(data&&data.loc)||(data&&data.from)||(data&&data.to)||{lat:-26.2,lng:28.04};
    map=new Map($('map'),{center:c,zoom:14,mapId:'DEMO_MAP_ID',disableDefaultUI:true,gestureHandling:'greedy',colorScheme:matchMedia('(prefers-color-scheme: dark)').matches?'DARK':'LIGHT'});
  }
  async function drawRoute(from,to){
    if(!from||!to||rtBusy)return;
    const key=[from.lat.toFixed(3),from.lng.toFixed(3),to.lat.toFixed(4),to.lng.toFixed(4)].join('|');
    if(key===rtKey&&Date.now()-rtAt<60000)return;
    rtBusy=true;
    try{
      const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+from.lng+','+from.lat+';'+to.lng+','+to.lat+'?overview=full&geometries=geojson');
      const j=await r.json();
      const c=j&&j.routes&&j.routes[0]&&j.routes[0].geometry&&j.routes[0].geometry.coordinates;
      if(!c||!c.length)return;
      const path=c.map(p=>({lat:p[1],lng:p[0]}));
      if(!rtLine){
        rtLine2=new google.maps.Polyline({map,path,strokeColor:'#1e40af',strokeWeight:9,strokeOpacity:1,zIndex:1});
        rtLine=new google.maps.Polyline({map,path,strokeColor:'#3b82f6',strokeWeight:6,strokeOpacity:1,zIndex:2});
      }else{rtLine.setPath(path);rtLine2.setPath(path);}
      rtKey=key;rtAt=Date.now();
      if(!fitted){fitted=true;const b=new google.maps.LatLngBounds();path.forEach(p=>b.extend(p));map.fitBounds(b,70);}
    }catch(e){}finally{rtBusy=false;}
  }
  function dotEl(color){const d=document.createElement('div');d.className='dot';d.style.background=color;return d;}
  function ago(ts){const s=Math.max(0,Math.round((Date.now()-new Date(ts).getTime())/1000));return s<60?s+' s ago':Math.round(s/60)+' min ago';}
  async function render(){
    if(!data)return;
    const ended=data.status==='ended'||data.status==='cancelled';
    const target=data.phase==='dropoff'?data.to:data.from;
    $('r-driver').style.display='flex';
    $('drv').textContent=data.driver?data.driver:'Driver';
    $('trk').textContent=[data.truck,data.plate].filter(Boolean).join(' · ');
    const pill=$('pill');
    if(ended){
      $('st').textContent=data.status==='cancelled'?'Trip cancelled':'Trip ended';
      $('sub').textContent='This link is no longer live.';
      pill.textContent='Ended';pill.className='pill off';
    }else{
      const stale=!data.loc||!data.ts||(Date.now()-new Date(data.ts).getTime()>120000);
      $('st').textContent=data.phase==='dropoff'?'On the way to the drop-off':'Driver is heading to the pickup';
      $('sub').textContent=stale?"Waiting for the driver's latest location…":'Live location';
      pill.textContent=stale?'Waiting':'Live';pill.className='pill'+(stale?' off':'');
    }
    $('upd').textContent=data.ts?'Updated '+ago(data.ts):'';
    $('msg').style.display='none';
    await ensureMap();
    if(ended&&rtLine){rtLine.setMap(null);rtLine2.setMap(null);rtLine=rtLine2=null;}
    if(target&&!pinA){pinA=new libs.AdvancedMarkerElement({map,position:target,content:dotEl('#1677F2')});}
    else if(target&&pinA){pinA.position=target;}
    if(data.loc){
      if(!drv){drvEl=document.createElement('div');drvEl.className='trk';drvEl.innerHTML='<i><img alt="" src="'+ARROW_IMG+'"></i>';drv=new libs.AdvancedMarkerElement({map,position:data.loc,content:drvEl});}
      else{drv.position=data.loc;}
      if(typeof data.loc.heading==='number'){drvEl.firstChild.style.transform='rotate('+data.loc.heading+'deg)';}
      if(target&&!ended){await drawRoute(data.loc,target);}
      if(!fitted){
        fitted=true;
        if(target){const b=new google.maps.LatLngBounds();b.extend(data.loc);b.extend(target);map.fitBounds(b,70);}
        else{map.setCenter(data.loc);map.setZoom(15);}
      }
    }else if(target&&!fitted){fitted=true;map.setCenter(target);map.setZoom(14);}
  }
  load(()=>{
    onSnapshot(doc(db,'shares',token),snap=>{
      if(!snap.exists()){showMsg('This trip link has expired or does not exist.');return;}
      data=snap.data();render().catch(()=>{});
    },()=>showMsg('Could not open this trip. The link may be wrong or sharing is not switched on yet.'));
    setInterval(()=>{if(data)render().catch(()=>{});},20000);
  });
}
